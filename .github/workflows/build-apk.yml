
name: Build Warden APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Warden APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find Android SDK manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Found SDK manager: $SDKMANAGER"

      - name: Accept Android SDK licences
        shell: bash
        run: |
          yes | "${{ steps.sdk.outputs.sdkmanager }}" --licenses \
            || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "${{ steps.sdk.outputs.sdkmanager }}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check Gradle wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew not found in repository root."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Find APK files
        if: success()
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warden-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
